<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Pawtech</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-shell">
        <header class="brand">
            <h1>PAWTECH</h1>
            <img class="pets" src="Pets.png" alt="A dog and three cats peeking over a line">
        </header>

        <section class="auth-card" aria-label="Account access">
            <nav class="auth-tabs" aria-label="Account pages">
                <a href="Log-in.html" aria-current="page">Log In</a>
                <a href="SignUp.html">Sign Up</a>
            </nav>
            <div class="auth-content">
                <h2>Welcome Back!</h2>
                <form id="login-form">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" autocomplete="email" required>

                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required>

                    <button type="submit">Log In</button>
                </form>
            </div>
        </section>
    </main>
    <div class="auth-loading" id="auth-loading" role="status" aria-live="polite" aria-hidden="true" hidden>
        <span class="loading-spinner" aria-hidden="true"></span>
        <p>Logging in...</p>
    </div>
    <script src="auth.js" defer></script>
</body>
</html>
